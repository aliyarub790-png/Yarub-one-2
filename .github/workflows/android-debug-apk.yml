name: Android Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Android project is not assumed to sit at the repository root.
      # The workflow locates the project automatically.
      - name: Locate Android project
        id: locate
        run: |
          dir="$(find . -name settings.gradle.kts -not -path '*/build/*' -printf '%h\n' | head -1)"
          if [ -z "$dir" ]; then
            echo "::error::No settings.gradle.kts found. The Android project is not in this repository."
            echo "Repository contents:"
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          echo "Android project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Invoked through sh so the executable bit is not required.
      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: sh gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
